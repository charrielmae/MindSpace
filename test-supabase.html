<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <div id="results"></div>
    
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testAuth()">Test Auth</button>
    <button onclick="testSignUp()">Test Sign Up</button>

    <script type="module">
        import { supabase, auth } from './javascript/supabase-config.js';

        function showResult(message, type = 'success') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong><br>${message}`;
            resultsDiv.appendChild(resultDiv);
        }

        async function testConnection() {
            showResult('Testing Supabase connection...', 'loading');
            
            try {
                // Test basic connection
                const { data, error } = await supabase.from('_test_connection').select('*').limit(1);
                
                if (error) {
                    showResult(`Connection Error: ${error.message}`, 'error');
                } else {
                    showResult('✅ Supabase connection successful!', 'success');
                }
            } catch (error) {
                showResult(`Connection Failed: ${error.message}`, 'error');
            }
        }

        async function testAuth() {
            showResult('Testing authentication functions...', 'loading');
            
            try {
                // Test current user
                const { data: { user }, error } = await supabase.auth.getUser();
                
                if (error) {
                    showResult(`Auth Error: ${error.message}`, 'error');
                } else if (user) {
                    showResult(`✅ Auth working! Current user: ${user.email}`, 'success');
                } else {
                    showResult('✅ Auth working! No current user', 'success');
                }
            } catch (error) {
                showResult(`Auth Test Failed: ${error.message}`, 'error');
            }
        }

        async function testSignUp() {
            showResult('Testing sign up function...', 'loading');
            
            try {
                const testEmail = `test_${Date.now()}@example.com`;
                const result = await auth.signUp(testEmail, 'password123', 'Test User');
                
                if (result.success) {
                    showResult(`✅ Sign up function working! Test user created: ${testEmail}`, 'success');
                } else {
                    showResult(`❌ Sign up failed: ${result.error}`, 'error');
                }
            } catch (error) {
                showResult(`Sign Up Test Failed: ${error.message}`, 'error');
            }
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            showResult('Page loaded. Click buttons to test Supabase connection.', 'loading');
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
