<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindSpace - Choose Your Interests</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/interests.css" />
  </head>
  <body>
    <div class="interests-container">
      <header class="interests-header">
        <button class="back-arrow">←</button>
        
      </header>

      <main class="interests-content">
        <h1>Welcome to MindSpace</h1>
        <p>Choose your recent medical & self-diagnosis</p>

        <div class="interests-grid">
          <button class="interest-item" data-interest="anxiety">
            Anxiety Disorder
          </button>
          <button class="interest-item" data-interest="depression">
            Depression
          </button>
          <button class="interest-item" data-interest="stress">Stress</button>
          <button class="interest-item" data-interest="sleeping">
            Sleeping Disorder
          </button>
          <button class="interest-item" data-interest="eating">
            Eating Disorder
          </button>
          <button class="interest-item" data-interest="burnout">Burnout</button>
          <button class="interest-item" data-interest="ocd">
            Obsessive-Compulsive Disorder
          </button>
          <button class="interest-item" data-interest="substance">
            Substance Use Disorder
          </button>
        </div>

        <div class="next-button">
          <button class="btn">Proceed</button>
        </div>
      </main>
    </div>

    <script src="../javascript/interests.js" defer></script>
  </body>
</html>
