<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindSpace - Mental Health Support</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/landing.css" />
    <script src="../javascript/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <nav class="navbar">
        <div class="logo">
          <div class="logo-shape"></div>
          <span>MindSpace</span>
        </div>
        <div class="nav-links">
          <a href="#about">About</a>
          <a href="#how-it-works">How it works</a>
          <a href="#features">Features</a>
          <a href="#blog">Blog</a>
        </div>
        <div class="nav-buttons">
          <button class="btn btn-outline">Sign up</button>
          <button class="btn btn-primary">Log in</button>
        </div>
      </nav>

      <main class="hero">
        <div class="hero-content">
          <div class="hero-text">
            <h1>Where Peace and Wellness Meet You</h1>
            <p>
              Connect with professional mental health providers who understand
              your unique needs. Start your wellness journey today with
              compassionate care and evidence-based treatments.
            </p>
            <button class="btn btn-gradient">Get Started</button>
          </div>
          <div class="hero-illustration">
            <div class="illustration-container">
              <div class="network-bg"></div>
              <img
                src="../images/mh.png"
                alt="Mental Health Illustration"
                class="mh-image"
              />
              <div class="cloud cloud-1"></div>
              <div class="cloud cloud-2"></div>
              <div class="cloud cloud-3"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
