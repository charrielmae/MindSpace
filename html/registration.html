<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="registration-box">
    <form action="">
      <h2>Register</h2>
      <div class="input-box">
        <span class="icon"><i class="fa fa-user"><ion-icon name="person"></ion-icon></i></span>
        <input type="text" required>
        <label>Username</label>
      </div>
      <div class="input-box">
        <span class="icon"><i class="fa fa-envelope"><ion-icon name="mail-unread"></ion-icon></i></span>
        <input type="email" required>
        <label>Email</label>
      </div>
      <div class="input-box">
        <span class="icon"><i class="fa fa-lock"><ion-icon name="lock-closed"></ion-icon></i></span>
        <input type="password" required>
        <label>Password</label>
      </div>
      <button type="submit">Register</button>
    </form>
  </div>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
