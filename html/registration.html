<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindSpace - Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="page-container">
  

    <!-- Main Content -->
    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join our community and start your wellness journey</p>
          </div>
          
          <form class="auth-form" id="registrationForm">
            <div class="input-group">
              <label for="name">Full Name</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa fa-user"></i></span>
                <input type="text" id="name" placeholder="Enter your full name" required>
              </div>
            </div>
            
            <div class="input-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa fa-envelope"></i></span>
                <input type="email" id="email" placeholder="example@email.com" required>
              </div>
            </div>
       
            <div class="input-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa fa-lock"></i></span>
       
                <input type="password" id="password" placeholder="•••••••" required>
                <button type="button" class="password-toggle" onclick="togglePassword('password')">
                  <i class="fa fa-eye" id="password-eye"></i>
                </button>
              </div>
            </div>
            
            <div class="input-group">
              <label for="confirm-password">Confirm Password</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fa fa-lock"></i></span>
                <input type="password" id="confirmPassword" placeholder="•••••••" required>
                <button type="button" class="password-toggle" onclick="togglePassword('confirm-password')">
                  <i class="fa fa-eye" id="confirm-password-eye"></i>
                </button>
              </div>
            </div>
            
            <button type="submit" class="btn btn-gradient auth-btn">Create Account</button>
            
            <div class="auth-footer">
              <p>Already have an account? <a href="index.html" class="auth-link">Sign In</a></p>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Supabase CDN for module resolution -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
        // Initialize Supabase
        const { createClient } = supabase
        const _supabase = createClient('https://wknutsngiknvzvajslgo.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrbnV0c25naWtudnp2YWpzbGdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTYyMjUsImV4cCI6MjA5MzczMjIyNX0.vi1FFJ7q-Fv0-mslyd6JD5FgDZtoR7T45wmvl37kJ30')

        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(fieldId + '-eye');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        async function handleRegistration(event) {
            event.preventDefault();
            
            // Get form elements with null checks
            const nameField = document.getElementById('name');
            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirmPassword');
            const submitBtn = document.querySelector('.auth-btn');
            
            // Validate all elements exist and debug which ones are missing
            console.log('Checking for form elements...');
            console.log('nameField:', nameField);
            console.log('emailField:', emailField);
            console.log('passwordField:', passwordField);
            console.log('confirmPasswordField:', confirmPasswordField);
            console.log('submitBtn:', submitBtn);
            
            if (!nameField || !emailField || !passwordField || !confirmPasswordField || !submitBtn) {
                console.error('Required form elements not found');
                console.error('Missing elements:', {
                    nameField: !nameField,
                    emailField: !emailField,
                    passwordField: !passwordField,
                    confirmPasswordField: !confirmPasswordField,
                    submitBtn: !submitBtn
                });
                alert('Form initialization error. Please refresh the page.');
                return;
            }
            
            // Get form values
            const name = nameField.value;
            const email = emailField.value;
            const password = passwordField.value;
            const confirmPassword = confirmPasswordField.value;
            
            // Basic validation
            if (!name || !email || !password || !confirmPassword) {
                alert('Please fill in all fields');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            // Show loading state
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Creating account...';
            submitBtn.disabled = true;

            try {
                const { data, error } = await _supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            name: name
                        },
                        email_confirm: false // Disable email confirmation for auto-confirmation
                    }
                });
                
                if (error) {
                    console.error('Registration error:', error);
                    alert(error.message || 'Registration failed');
                } else {
                    console.log('Registration successful:', data);
                    alert('Account created successfully! You can now log in.');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Registration failed. Please try again.');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }

        // Set up form listener with enhanced DOM ready check
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, setting up registration form...');
            
            // Enhanced DOM loading detection with retry mechanism
            let retryCount = 0;
            const maxRetries = 10;
            
            function setupForm() {
                const registrationForm = document.getElementById('registrationForm');
                const nameField = document.getElementById('name');
                const emailField = document.getElementById('email');
                const passwordField = document.getElementById('password');
                const confirmPasswordField = document.getElementById('confirmPassword');
                const submitBtn = document.querySelector('.auth-btn');
                
                console.log('Form elements check:', {
                    registrationForm: !!registrationForm,
                    nameField: !!nameField,
                    emailField: !!emailField,
                    passwordField: !!passwordField,
                    confirmPasswordField: !!confirmPasswordField,
                    submitBtn: !!submitBtn
                });
                
                if (registrationForm && nameField && emailField && passwordField && confirmPasswordField && submitBtn) {
                    console.log('All form elements found, attaching submit listener');
                    registrationForm.addEventListener('submit', handleRegistration);
                    return true;
                }
                return false;
            }
            
            // Retry mechanism with increasing delays
            function attemptSetup() {
                if (setupForm()) {
                    console.log('Registration form setup successful');
                    return;
                }
                
                retryCount++;
                if (retryCount >= maxRetries) {
                    console.error('Failed to setup registration form after', maxRetries, 'attempts');
                    alert('Form setup failed. Please refresh the page.');
                    return;
                }
                
                const delay = Math.min(100 * retryCount, 1000);
                console.log(`Retry ${retryCount}/${maxRetries} in ${delay}ms`);
                setTimeout(attemptSetup, delay);
            }
            
            // Start the retry process
            attemptSetup();
        });
    </script>

</body>
</html>
