<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace - Login</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="page-container">
      

      <!-- Main Content -->
      <main class="auth-main">
        <div class="auth-container">
          <div class="auth-card">
            <div class="auth-header">
              <h2>Welcome Back</h2>
              <p>Sign in to continue your wellness journey</p>
            </div>
            
            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
              <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                  <span class="input-icon"><i class="fa fa-envelope"></i></span>
                  <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>
              </div>
              
              <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                  <span class="input-icon"><i class="fa fa-lock"></i></span>
                  <input type="password" id="password" placeholder="••••••••" required>
                  <button type="button" class="password-toggle" onclick="togglePassword('password')">
                    <i class="fa fa-eye" id="password-eye"></i>
                  </button>
                </div>
              </div>
              
              <div class="form-options">
                <label class="checkbox-label">
                  <input type="checkbox">
                  <span class="checkmark"></span>
                  Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
              </div>
              
              <button type="submit" class="btn btn-gradient auth-btn">Sign In</button>
              
              <div class="auth-footer">
                <p>Don't have an account? <a href="registration.html" class="auth-link">Register</a></p>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
        
    <!-- Supabase CDN for module resolution -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
        import { auth } from '../javascript/supabase-config.js';

        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(fieldId + '-eye');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Basic validation
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            // Show loading state
            const submitBtn = document.querySelector('.auth-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            try {
                const result = await auth.signIn(email, password);
                
                if (result.success) {
                    alert('Login successful!');
                    window.location.href = '../html/dashboard.html';
                } else {
                    alert(result.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed. Please try again.');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }

        // Set up form listener
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }
        });
    </script>
        
</body>
</html>
